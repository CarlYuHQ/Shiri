[global]
error_log = /Users/carl/WorkBuddy/2026-11-06-12-16-22/runtime/logs/php-fpm.log
pid = /Users/carl/WorkBuddy/2026-11-06-12-16-22/runtime/run/php-fpm.pid
daemonize = yes
log_level = warning

[www]
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
clear_env = no

php_admin_value[memory_limit] = 512M
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 64M
php_admin_value[max_execution_time] = 120
php_admin_value[date.timezone] = Asia/Shanghai
