worker_processes  1;
error_log  /Users/carl/WorkBuddy/2026-11-06-12-16-22/runtime/logs/nginx-error.log  warn;
pid        /Users/carl/WorkBuddy/2026-11-06-12-16-22/runtime/run/nginx.pid;

events {
    worker_connections  128;
}

http {
    include       /opt/homebrew/etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /Users/carl/WorkBuddy/2026-11-06-12-16-22/runtime/logs/nginx-access.log;

    client_body_temp_path  /Users/carl/WorkBuddy/2026-11-06-12-16-22/runtime/tmp/client_body;
    proxy_temp_path        /Users/carl/WorkBuddy/2026-11-06-12-16-22/runtime/tmp/proxy;
    fastcgi_temp_path      /Users/carl/WorkBuddy/2026-11-06-12-16-22/runtime/tmp/fastcgi;
    uwsgi_temp_path        /Users/carl/WorkBuddy/2026-11-06-12-16-22/runtime/tmp/uwsgi;
    scgi_temp_path         /Users/carl/WorkBuddy/2026-11-06-12-16-22/runtime/tmp/scgi;

    sendfile           on;
    keepalive_timeout  65;
    client_max_body_size 64M;

    server {
        # 仅监听回环：自动登录只对回环地址生效，禁止局域网访问以免免密入口被外部使用。
        # 同时监听 IPv4 与 IPv6 回环：BASE_URL 用的是 localhost，macOS 会先解析到 ::1，
        # 只绑 127.0.0.1 时 WebKit 取 CSS/JS 可能直接失败（页面裸样式）。
        listen       127.0.0.1:8080;
        listen       [::1]:8080;
        server_name  localhost;
        root         /Users/carl/WorkBuddy/2026-11-06-12-16-22/app/public;
        index        index.php;
        charset      utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass   127.0.0.1:9000;
            fastcgi_index  index.php;
            include        /opt/homebrew/etc/nginx/fastcgi.conf;
            fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
            fastcgi_read_timeout 120;
        }

        # 静态资源每次回源校验：改完 CSS/JS 立刻生效，不会被 WebView 的缓存
        # 拿旧样式去配新 HTML（7 列网格塌成一列就是这么来的）
        location ~* \.(css|js|png|jpe?g|gif|svg|ico|woff2?)$ {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        location ~ /\. {
            deny all;
        }
    }
}
